<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WanderLust — Travel Recommendations</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="brand">
    <i class="fas fa-compass"></i> Wander<span>Lust</span>
  </a>
  <ul class="nav-links">
    <li><a class="active" href="index.html"><i class="fas fa-home"></i> Home</a></li>
    <li><a href="about.html"><i class="fas fa-info-circle"></i> About Us</a></li>
    <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact Us</a></li>
  </ul>
  <div class="search-area">
    <input type="text" id="searchInput" placeholder="Search destinations..." />
    <button class="btn-search" id="searchBtn"><i class="fas fa-search"></i> Search</button>
    <button class="btn-clear" id="clearBtn"><i class="fas fa-times"></i> Clear</button>
  </div>
</nav>

<main class="page">
  <section class="hero">
    <h1><i class="fas fa-map-pin"></i> Find Your Next Escape</h1>
    <p>
      Discover handpicked travel recommendations, hidden gems, and
      unforgettable destinations — tailored just for you.
    </p>
    <div class="tag">
      <i class="fas fa-globe-americas"></i> Explore · Dream · Discover
    </div>
  </section>

  <section>
    <h2 class="section-title"><i class="fas fa-umbrella-beach" style="color:#f7c948;"></i> Recommended Destinations</h2>
    <div id="resultsGrid" class="results-grid"></div>
    <div id="noResults" class="no-results" style="display:none;">
      <i class="fas fa-sad-tear"></i> No destinations match your search.
    </div>
  </section>
</main>

<script>
  (function() {
    const destinations = [
      { name: "Bora Bora, French Polynesia", description: "Turquoise lagoon, overwater bungalows, and pristine white sands.", category: "beach", image: "https://picsum.photos/seed/borabora/400/250" },
      { name: "Maldives", description: "Crystal-clear waters, vibrant marine life, and luxury resorts.", category: "beach", image: "https://picsum.photos/seed/maldives/400/250" },
      { name: "Maui, Hawaii", description: "Golden beaches, lush rainforests, and the Road to Hana.", category: "beach", image: "https://picsum.photos/seed/maui/400/250" },
      { name: "Angkor Wat, Cambodia", description: "The world's largest religious monument, a stunning temple complex.", category: "temple", image: "https://picsum.photos/seed/angkorwat/400/250" },
      { name: "Borobudur, Indonesia", description: "A 9th-century Mahayana Buddhist temple with intricate carvings.", category: "temple", image: "https://picsum.photos/seed/borobudur/400/250" },
      { name: "Golden Temple, Amritsar", description: "The holiest Gurudwara, surrounded by a sacred pool.", category: "temple", image: "https://picsum.photos/seed/goldentemple/400/250" },
      { name: "Japan", description: "A fascinating blend of ancient traditions and futuristic innovation.", category: "country", image: "https://picsum.photos/seed/japan/400/250" },
      { name: "Italy", description: "Renowned for its art, cuisine, history, and stunning landscapes.", category: "country", image: "https://picsum.photos/seed/italy/400/250" },
      { name: "Egypt", description: "Home to ancient pyramids, the Nile, and a rich cultural heritage.", category: "country", image: "https://picsum.photos/seed/egypt/400/250" },
      { name: "Santorini, Greece", description: "White-washed houses, blue domes, and stunning caldera views.", category: "island", image: "https://picsum.photos/seed/santorini/400/250" },
      { name: "Bali, Indonesia", description: "Rice terraces, volcanic mountains, and sacred temples.", category: "culture", image: "https://picsum.photos/seed/bali/400/250" },
      { name: "Amalfi Coast, Italy", description: "Cliffside villages, lemon groves, and Mediterranean charm.", category: "coastal", image: "https://picsum.photos/seed/amalfi/400/250" }
    ];

    const grid = document.getElementById('resultsGrid');
    const noResults = document.getElementById('noResults');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearBtn');

    function renderResults(filterText = '') {
      const query = filterText.trim().toLowerCase();
      const filtered = query === '' ? destinations : destinations.filter(d =>
        d.name.toLowerCase().includes(query) ||
        d.category.toLowerCase().includes(query) ||
        d.description.toLowerCase().includes(query)
      );

      grid.innerHTML = '';

      if (filtered.length === 0) {
        noResults.style.display = 'block';
        return;
      }
      noResults.style.display = 'none';

      filtered.forEach(dest => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <img src="${dest.image}" alt="${dest.name}" loading="lazy" />
          <div class="card-body">
            <h3>${dest.name}</h3>
            <p>${dest.description}</p>
            <span class="tag"><i class="fas fa-tag"></i> ${dest.category}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function performSearch() {
      renderResults(searchInput.value);
    }

    function clearSearch() {
      searchInput.value = '';
      renderResults('');
      searchInput.focus();
    }

    searchBtn.addEventListener('click', performSearch);
    clearBtn.addEventListener('click', clearSearch);
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        performSearch();
      }
    });

    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if (q) {
      searchInput.value = q;
    }
    renderResults(searchInput.value);
  })();
</script>
</body>
</html>
